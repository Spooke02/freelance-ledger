services:
  - type: web
    name: freelance-ledger
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /
    envVars:
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false          # enter in the Render dashboard (PayPal SANDBOX client id)
      - key: PAYPAL_CLIENT_SECRET
        sync: false          # enter in the Render dashboard (PayPal SANDBOX secret)
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: AI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_API_KEY
        sync: false          # enter in the Render dashboard (Gemini key)
      - key: ASK_LIMIT_PER_HOUR
        value: "10"
      - key: PYTHON_VERSION
        value: 3.12.7

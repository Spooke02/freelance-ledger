<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreelanceLedger</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/styles/ag-grid.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/styles/ag-theme-quartz.css">
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/dist/ag-grid-community.min.js"></script>
<style>
:root{--bg:#f7f8fa;--card:#fff;--tx:#14213d;--mu:#5b6678;--ln:#e3e7ee;--ac:#1f3a5f;--ok:#2e8b57;--bad:#b33a3a}
@media(prefers-color-scheme:dark){:root{--bg:#0f1624;--card:#17213a;--tx:#eef2f8;--mu:#a3b0c4;--ln:#27344f;--ac:#f5c542}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Segoe UI",sans-serif}
.w{max-width:980px;margin:0 auto;padding:20px}
h1{margin:0 0 4px}
p.s{color:var(--mu);margin:0 0 16px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.c{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px}
.c b{display:block;font-size:1.4rem}
.bar{height:10px;background:var(--ln);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--ln);margin-top:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--ln);text-align:left;font-size:.9rem}
th{color:var(--mu);font-weight:600}
.r{text-align:right}
.tag{font-size:.75rem;border:1px solid var(--ln);border-radius:99px;padding:1px 8px;color:var(--mu)}
.note{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-top:14px}
button,select{font:inherit;padding:7px 12px;border-radius:8px;border:1px solid var(--ln);background:var(--card);color:var(--tx)}
.err{color:var(--bad)}
@media(max-width:700px){.h{display:none}}
</style>
</head>
<body>
<div class="w">
  <h1>FreelanceLedger</h1>
  <p class="s">Track foreign freelance income in INR, GST-threshold progress and e-FIRA/FIRC paperwork. Record-keeping only, not tax advice.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center">
    <label>Source
      <select id="src"><option value="demo">Demo data</option><option value="paypal">PayPal sandbox</option></select>
    </label>
    <button id="go">Refresh</button><span id="msg" role="status"></span>
  </div>
  <div class="g" id="cards"></div>
  <div class="note" id="exp"></div>
  <div id="grid" class="ag-theme-quartz" style="height:340px;margin-top:14px"></div>
  <div class="note">
    <label for="q"><b>Ask your ledger</b></label>
    <div style="display:flex;gap:8px;margin-top:8px"><input id="q" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--ln);background:var(--card);color:var(--tx)" placeholder="e.g. Which payments still need an e-FIRA, and which client paid the most?"><button id="askbtn">Ask</button></div>
    <p id="ans" style="margin:10px 0 0"></p>
  </div>
  <p class="s" id="eng" style="margin-top:12px"></p>
</div>
<script>
const $ = id => document.getElementById(id);
const f = n => n.toLocaleString('en-IN', {maximumFractionDigits: 0});
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gridApi = agGrid.createGrid($('grid'), {
  columnDefs: [
    {field: 'date', headerName: 'Date', width: 120},
    {field: 'payer', headerName: 'Payer', flex: 1.4, minWidth: 140},
    {field: 'category', headerName: 'Category', flex: 1, minWidth: 130},
    {headerName: 'Amount', valueGetter: p => p.data.gross.toFixed(2) + ' ' + p.data.currency, width: 140, type: 'rightAligned'},
    {field: 'fee', headerName: 'Fee', width: 90, type: 'rightAligned', valueFormatter: p => p.value.toFixed(2)},
    {field: 'gross_inr', headerName: 'Gross INR', width: 130, type: 'rightAligned', valueFormatter: p => '₹' + f(p.value)},
    {headerName: 'e-FIRA/FIRC on file', width: 170, cellRenderer: p => {
      if (p.data.currency === 'INR') return 'n/a';
      const el = document.createElement('input'); el.type = 'checkbox'; el.checked = p.data.has_firc; el.setAttribute('aria-label', 'e-FIRA on file');
      el.onchange = () => mark(p.data.id, el.checked); return el; }},
  ],
  defaultColDef: {sortable: true, filter: true, resizable: true},
  domLayout: 'normal',
  overlayNoRowsTemplate: 'No payments for this source yet',
});
async function load() {
  $('msg').textContent = 'Loading...'; $('msg').className = '';
  const r = await fetch('/api/state?source=' + $('src').value);
  const j = await r.json();
  if (!r.ok) { $('msg').textContent = j.detail || 'Error'; $('msg').className = 'err'; return; }
  $('msg').textContent = '';
  const s = j.summary;
  $('cards').innerHTML =
    `<div class="c">FY ${esc(s.fy)} gross<b>₹${f(s.gross_inr)}</b>${s.count} payments</div>` +
    `<div class="c">Platform fees<b>₹${f(s.fees_inr)}</b>Net ₹${f(s.net_inr)}</div>` +
    `<div class="c">GST threshold<b>${(s.threshold_pct * 100).toFixed(1)}%</b>${esc(s.status)}` +
    `<div class="bar"><i style="width:${Math.min(100, s.threshold_pct * 100)}%"></i></div></div>` +
    `<div class="c">Missing e-FIRA/FIRC<b>${s.missing_firc.length}</b>foreign payments</div>`;
  $('exp').textContent = j.explanation;
  gridApi.setGridOption('rowData', j.txns);
  $('eng').textContent = `AI: categories by ${j.ai.categorise}, explanation by ${j.ai.explain}. ` + (j.source === 'demo' ? 'Demo data is fictional.' : '');
}
async function mark(id, value) {
  await fetch('/api/firc', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({id, value})});
  load();
}
$('askbtn').onclick = async () => {
  const question = $('q').value.trim(); if (!question) return;
  $('ans').textContent = 'Thinking...';
  const r = await fetch('/api/ask', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({question, source: $('src').value})});
  const j = await r.json(); $('ans').textContent = (j.answer || j.detail || 'Error') + (j.engine ? '  [' + j.engine + ']' : '');
};
$('go').onclick = load; $('src').onchange = load; load();
</script>
</body>
</html>
